<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission numérique 6e</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#203149;background:#f0f4fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:16px}header{background:#17365f;color:#fff;padding:24px;border-radius:15px}h1{margin:0 0 10px}h2{line-height:1.3}.panel{background:#fff;padding:26px;border-radius:15px;margin-top:16px;box-shadow:0 2px 12px #1232}.progress{height:11px;background:#617591;border-radius:20px;overflow:hidden;margin:18px 0 10px}.bar{height:100%;background:#7de1b7;transition:width .2s}.steps{display:flex;gap:7px;flex-wrap:wrap}.steps span{background:#315178;border-radius:20px;padding:7px 10px;font-size:13px}.steps .active{background:#e0f7eb;color:#173b30}.task,.help,.scenario,.result{padding:17px;border-radius:10px;line-height:1.65;margin:14px 0}.task{background:#edf4ff;border-left:5px solid #346ab4}.help{background:#f3f7fd;border:1px solid #b5cbe6}.scenario{background:#fff5e7}.result{background:#edf9f1}button,.btn{display:inline-block;background:#205eaa;color:white;border:0;padding:12px 17px;border-radius:8px;font-size:16px;cursor:pointer;margin:5px 6px 5px 0;text-decoration:none}button.secondary,.btn.secondary{background:#e4ebf5;color:#173b66}button:disabled{opacity:.55;cursor:not-allowed}.question{border-top:1px solid #d9e2ed;margin-top:19px;padding-top:17px}.options{display:grid;gap:8px;margin:12px 0}.options label{border:1px solid #cbd5e1;border-radius:9px;padding:11px;cursor:pointer;display:block}.options label:has(input:checked){background:#eaf2ff;border-color:#376cae}.feedback{padding:12px;border-radius:8px;margin:8px 0}.ok{background:#dff6e9;color:#145b3d}.bad{background:#fff0e9;color:#853a22}.muted{color:#53667e}.pill{font-weight:bold;color:#315d98}.hidden{display:none}textarea{width:100%;min-height:110px;font:inherit;padding:12px;border:1px solid #aabed5;border-radius:8px}label.check{display:block;margin:15px 0}.call{border:3px solid #277254;background:#e4f6e9;border-radius:12px;padding:20px;text-align:center;font-size:21px;font-weight:bold}.score{font-size:25px;font-weight:bold}.bonus{background:#f5f0ff;padding:18px;border-radius:10px}.small{font-size:14px}footer{text-align:center;color:#53657b;padding:20px}a{color:#145aa3}ol li{margin:7px 0}.num{font-weight:bold;color:#225e9d}code{background:#e7edf5;padding:2px 5px;border-radius:4px} .divider{border-top:1px solid #dbe3ed;margin:20px 0}@media(max-width:650px){.wrap{padding:8px}.panel{padding:16px}header{padding:17px}h1{font-size:24px}}@media print{header,footer,button,.noprint{display:none!important}.panel{box-shadow:none}}
</style></head><body><div class="wrap"><header><h1>Mission numérique — 6e</h1><div>Apprendre à utiliser l'ordinateur, rechercher et vérifier des informations, puis créer un document · environ 50 minutes</div><div class="progress"><div class="bar" id="bar"></div></div><div class="steps" id="steps"></div></header><main class="panel" id="app"></main><footer>Les réponses restent dans ce navigateur sur cet ordinateur. Elles ne sont pas envoyées au professeur. Télécharger le bilan avant de quitter.</footer></div><script>
'use strict';
const missions=[
{title:'Créer son dossier personnel',time:'8 min',instruction:'Depuis le bureau, ouvrir « Mes documents », puis le dossier « Documents ». Dans ce dossier Documents, créer un dossier appelé Informatique_6e. Ne pas créer de sous-dossier.',steps:['Repérer l’icône « Mes documents » sur le bureau et double-cliquer dessus.','Dans la fenêtre ouverte, repérer le dossier nommé « Documents ». Double-cliquer sur ce dossier : c’est ici que le travail sera rangé.','Dans un espace vide de la fenêtre, faire un clic droit, puis choisir « Nouveau dossier » (le nom du menu peut varier).','Écrire exactement Informatique_6e, puis appuyer sur Entrée.','Vérifier que le nouveau dossier est visible dans « Documents ». Ne pas créer d’autres dossiers.'],questions:[{q:'Quel chemin faut-il suivre pour créer le dossier de travail ?',options:['Bureau → Corbeille','Bureau → Mes documents → Documents','Bureau → Téléchargements','Navigateur → Historique','Bureau → Images','Menu → Arrêter'],a:1,why:'Le dossier Informatique_6e doit se trouver dans « Documents », à l’intérieur de « Mes documents ».'},{q:'Quel nom faut-il donner au dossier ?',options:['Nouveau dossier','Informatique 5e','Mes documents','Travail','Informatique_6e','Images'],a:4,why:'Le nom demandé est Informatique_6e, sans sous-dossier.'},{q:'Comment créer un dossier à l’endroit demandé ?',options:['Faire un clic droit dans un espace vide et choisir « Nouveau dossier »','Appuyer sur la touche Échap','Fermer la fenêtre','Cliquer sur la corbeille','Ouvrir un site Internet','Débrancher la souris'],a:0,why:'Le clic droit permet généralement de créer un nouveau dossier.'}]},
{title:'Utiliser un navigateur et rechercher',time:'7 min',instruction:'Ouvrir le navigateur Internet. Ouvrir un nouvel onglet, puis rechercher le site officiel de la CNIL (cnil.fr). Repérer le nom complet de cet organisme. Revenir ensuite à cette mission.',steps:['Ouvrir le navigateur Internet depuis le bureau ou la barre des tâches.','Appuyer sur Ctrl + T pour ouvrir un nouvel onglet.','Dans la barre d’adresse, écrire cnil.fr et appuyer sur Entrée.','Sur le site, chercher la signification du sigle CNIL, par exemple dans la présentation de l’organisme.','Revenir à l’onglet de la mission en cliquant sur son onglet en haut de l’écran.'],url:'https://www.cnil.fr/',link:'Ouvrir le site de la CNIL',questions:[{q:'Que permet le raccourci Ctrl + T ?',options:['Imprimer une page','Éteindre le PC','Ouvrir un nouvel onglet','Supprimer un fichier','Créer un dossier','Enregistrer sous'],a:2,why:'Ctrl + T ouvre un nouvel onglet dans la plupart des navigateurs.'},{q:'Que signifie CNIL ?',options:['Centre national des images libres','Commission nationale de l’informatique et des libertés','Conseil numérique international des lycées','Comité national des informations locales','Centre national de l’Internet libre','Commission nouvelle pour Internet et les logiciels'],a:1,why:'La CNIL est la Commission nationale de l’informatique et des libertés.'},{q:'Quelle adresse correspond au site officiel consulté ?',options:['cnil-cadeau.example','mon-reseau.example','video-cnil.example','cnil.fr','reseau-gratuit.example','internet-astuce.example'],a:3,why:'Le domaine officiel de la CNIL est cnil.fr.'}]},
{title:'Protéger ses informations personnelles',time:'7 min',instruction:'Sur le site de la CNIL, chercher des conseils pour protéger ses données personnelles. Lire les exemples, puis répondre aux questions. Il est possible d’utiliser la recherche du site ou un moteur de recherche avec « CNIL données personnelles conseils ».',steps:['Ouvrir le site de la CNIL avec le bouton ci-dessous.','Chercher « données personnelles » et lire un conseil destiné aux internautes.','Repérer des exemples de données qui permettent d’identifier une personne.','Revenir à l’onglet de cette mission et répondre.'],url:'https://www.cnil.fr/',link:'Consulter les conseils de la CNIL',questions:[{q:'Laquelle de ces informations est une donnée personnelle ?',options:['Le nombre de jours dans une semaine','Le nom d’une planète','Une recette sans auteur','La couleur du ciel','Ton adresse personnelle','Le résultat de 8 × 7'],a:4,why:'Une adresse personnelle permet de localiser ou d’identifier une personne.'},{q:'Un inconnu te demande ton adresse et tes horaires. Que faire ?',options:['Les publier dans un commentaire','Les envoyer si son profil est sympathique','Ne pas les communiquer et demander conseil à un adulte','Les donner contre un cadeau','Les afficher sur son profil','Les envoyer à tous ses contacts'],a:2,why:'Il ne faut pas communiquer ces informations à un inconnu.'},{q:'Quel mot de passe est le plus difficile à deviner ?',options:['123456','prenom2026','azerty','motdepasse','111111','Un mot de passe long, unique et difficile à deviner'],a:5,why:'Un mot de passe long et unique protège mieux un compte.'}]},
{title:'Réagir au cyberharcèlement',time:'8 min',instruction:'Ouvrir le site 3018.fr. Rechercher le numéro national d’aide pour les jeunes victimes de harcèlement et de violences numériques. Lire les situations, puis écrire ce que tu ferais dans deux cas.',steps:['Ouvrir le site 3018.fr dans un autre onglet.','Repérer le numéro d’aide affiché sur le site.','Revenir ici et répondre aux QCM.','Lire les situations A et B. Pour chacune, écrire une réaction utile avec tes propres mots.'],url:'https://3018.fr/',link:'Ouvrir le site 3018',situations:['A. Dans un groupe de discussion, plusieurs élèves se moquent régulièrement d’un camarade.','B. Une photo d’un élève est publiée sans son accord et il demande qu’elle soit retirée.'],prompt:'Expliquer comment réagir dans les deux situations A et B (au moins 50 caractères au total).',questions:[{q:'Quel numéro national permet de demander de l’aide face au harcèlement ou aux violences numériques ?',options:['15','17','18','3018','112','118 218'],a:3,why:'Le 3018 est le numéro national d’aide aux jeunes victimes de harcèlement et de violences numériques.'},{q:'Que faire face à des moqueries répétées en ligne ?',options:['Les partager pour rire','Conserver les preuves et demander l’aide d’un adulte de confiance','Répondre par des insultes','Publier l’adresse de l’auteur','Créer un autre groupe pour se moquer','Ignorer systématiquement la victime'],a:1,why:'Conserver les preuves et chercher de l’aide permet d’agir.'},{q:'Avant de publier la photo d’un camarade, il faut…',options:['Demander son accord','La publier si elle est amusante','La modifier sans le prévenir','La publier seulement le soir','L’envoyer à des inconnus','La publier si on connaît son prénom'],a:0,why:'Il faut respecter la vie privée et demander l’accord de la personne.'}]},
{title:'Reconnaître une information douteuse',time:'8 min',instruction:'Lire les trois publications fictives. Pour chacune, réfléchir à ce qu’il faudrait vérifier avant de croire ou de partager. Écrire ensuite une réaction personnelle pour deux exemples.',steps:['Lire les trois exemples ci-dessous : ils sont inventés pour l’exercice.','Pour chaque exemple, se demander : qui parle ? Quand ? Quelle preuve ? Quelle source officielle ?','Choisir deux exemples et expliquer comment vérifier l’information.','Répondre aux QCM avant de passer au bilan.'],situations:['1. « Tous les collèges seront fermés demain ! » Aucun organisme n’est cité.','2. Une photo d’inondation est présentée comme datant d’aujourd’hui, mais sans date ni lieu.','3. « Partage ce message à dix personnes pour gagner un téléphone ! »'],prompt:'Choisir deux exemples et expliquer ce qu’il faudrait vérifier (au moins 50 caractères au total).',questions:[{q:'Un message annonce la fermeture de tous les collèges sans source. Que faire ?',options:['Le transmettre immédiatement','Le croire parce qu’il est très partagé','Vérifier auprès des sources officielles','Le publier sur tous les réseaux','Ne lire que son titre','Inventer une autre annonce'],a:2,why:'Une annonce importante doit être confirmée par une source officielle.'},{q:'Pourquoi une photo peut-elle être trompeuse ?',options:['Parce que toutes les photos sont fausses','Parce qu’une photo ne montre jamais rien','Parce qu’elle contient toujours une publicité','Parce qu’elle est en couleur','Parce qu’elle peut être ancienne ou sortie de son contexte','Parce qu’elle a été prise avec un téléphone'],a:4,why:'Une vraie photo peut être utilisée pour raconter une histoire fausse.'},{q:'Que prouve le fait qu’une publication ait beaucoup de partages ?',options:['Qu’elle a été vérifiée par la police','Qu’elle est toujours vraie','Qu’elle provient d’un scientifique','Qu’elle est récente','Qu’elle est officielle','Seulement qu’elle a beaucoup circulé'],a:5,why:'La popularité ne prouve pas la vérité d’une information.'}]}
];
const KEY='mission_numerique_6e_v1',total=missions.reduce((n,m)=>n+m.questions.length,0);const initial=()=>({step:0,answers:{},attempts:{},first:{},notes:{},proof:{},downloaded:false,writerDone:false,bonusDone:false});let s;try{s=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!s||!Number.isInteger(s.step)||s.step<0||s.step>missions.length+1)s=initial();for(const k of ['answers','attempts','first','notes','proof'])if(!s[k])s[k]={};const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}function score(){return Object.values(s.first).filter(Boolean).length}function verified(){return Object.values(s.answers).filter(Boolean).length}function lines(){let out=['MISSION NUMÉRIQUE — SIXIÈME','Nom et prénom : ................................................','Date : '+new Date().toLocaleDateString('fr-FR'),'','MON BILAN',`Note des QCM (première tentative) : ${score()} / ${total}`,'Une réponse fausse au premier essai rapporte 0 point, même si elle a été corrigée ensuite.','','1. MON DOSSIER','Mon dossier de travail : Mes documents / Documents / Informatique_6e','','2. NAVIGUER ET RECHERCHER','3. PROTÉGER MES DONNÉES','4. RÉAGIR AU CYBERHARCÈLEMENT','5. RECONNAÎTRE LES FAUSSES INFORMATIONS',''];missions.forEach((m,i)=>{out.push('--- '+(i+1)+'. '+m.title.toUpperCase()+' ---');m.questions.forEach((q,j)=>out.push('• '+q.q+'\n  Réponse correcte : '+q.options[q.a]));if(m.prompt)out.push('Ma réflexion :\n'+(s.notes[i]||''));out.push('')});out.push('MES TROIS RÈGLES POUR UN INTERNET RESPONSABLE','1. Vérifier une information avant de la partager.','2. Respecter les autres et demander de l’aide si nécessaire.','3. Protéger mes informations personnelles.');return out.join('\n')}
function render(){const idx=s.step;$('bar').style.width=(Math.min(idx,missions.length+1)/(missions.length+1)*100)+'%';$('steps').innerHTML=[...missions.map((m,i)=>`<span class="${idx===i?'active':''}">${i<idx?'✓ ':''}Mission ${i+1}</span>`),`<span class="${idx===5?'active':''}">Bilan</span>`,`<span class="${idx===6?'active':''}">Writer</span>`].join('');if(idx===5){bilan();return}if(idx===6){writer();return}const m=missions[idx];let html=`<p class="pill">Mission ${idx+1} sur 5 · ${esc(m.time)}</p><h2>${esc(m.title)}</h2><div class="task"><strong>Travail à réaliser</strong><p>${esc(m.instruction)}</p></div><button class="secondary" id="helpBtn" aria-expanded="false">Afficher la fiche d’aide détaillée</button><div id="helpBox" class="help hidden"><strong>Fiche d’aide — étape par étape</strong><ol>${m.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`;if(m.url)html+=`<p><a class="btn" href="${m.url}" target="_blank" rel="noopener noreferrer">${esc(m.link)} (nouvel onglet)</a></p>`;if(m.situations)html+=`<div class="scenario"><strong>Situations à analyser</strong><ol>${m.situations.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>`;if(m.prompt)html+=`<h3>Ma réponse personnelle</h3><p>${esc(m.prompt)}</p><textarea id="note" placeholder="Écrire ici sa réponse…">${esc(s.notes[idx]||'')}</textarea><p class="muted small">Le professeur vérifiera le contenu. Minimum : 50 caractères.</p>`;html+=`<label class="check"><input id="proof" type="checkbox" ${s.proof[idx]?'checked':''}> Je confirme avoir réalisé le travail demandé.</label><h3>Questions de vérification</h3><p class="muted small">Une seule bonne réponse parmi A, B, C, D, E et F. Une erreur au premier essai donne 0 point pour cette question ; il faut quand même trouver la bonne réponse pour continuer.</p>`;m.questions.forEach((q,j)=>{let k=idx+'-'+j,ok=s.answers[k]===true;html+=`<div class="question"><strong>${j+1}. ${esc(q.q)}</strong><div class="options">${q.options.map((o,n)=>`<label><input type="radio" name="q${j}" value="${n}" ${ok?'disabled':''}> <b>${'ABCDEF'[n]}.</b> ${esc(o)}</label>`).join('')}</div><button data-check="${j}" ${ok?'disabled':''}>${ok?'Réponse validée':'Vérifier ma réponse'}</button><div id="fb${j}" aria-live="polite">${ok?`<div class="feedback ok">Bonne réponse validée. ${esc(q.why)}</div>`:''}</div></div>`});html+=`<div class="divider"></div><button id="next">${idx===4?'Voir mon bilan':'Passer à la mission suivante'}</button><div id="nextmsg" aria-live="polite"></div>`;$('app').innerHTML=html;$('helpBtn').onclick=()=>{const box=$('helpBox');box.classList.toggle('hidden');$('helpBtn').setAttribute('aria-expanded',String(!box.classList.contains('hidden')))};if($('note'))$('note').oninput=e=>{s.notes[idx]=e.target.value;save()};$('proof').onchange=e=>{s.proof[idx]=e.target.checked;save()};document.querySelectorAll('[data-check]').forEach(b=>b.onclick=()=>{const j=Number(b.dataset.check),q=m.questions[j],key=idx+'-'+j,chosen=document.querySelector(`input[name="q${j}"]:checked`);if(!chosen){$('fb'+j).innerHTML='<div class="feedback bad">Choisir une réponse A à F.</div>';return}const good=Number(chosen.value)===q.a;s.attempts[key]=(s.attempts[key]||0)+1;if(s.attempts[key]===1)s.first[key]=good;if(good){s.answers[key]=true;b.disabled=true;document.querySelectorAll(`input[name="q${j}"]`).forEach(el=>el.disabled=true);$('fb'+j).innerHTML=`<div class="feedback ok">Bonne réponse. ${esc(q.why)}</div>`}else $('fb'+j).innerHTML='<div class="feedback bad">Réponse incorrecte. Cette question rapporte 0 point si c’était le premier essai. Relire la consigne ou consulter le site, puis réessayer.</div>';save()});$('next').onclick=()=>{let all=m.questions.every((q,j)=>s.answers[idx+'-'+j]===true),noteOk=!m.prompt||(s.notes[idx]||'').trim().length>=50;if(!all||!s.proof[idx]||!noteOk){$('nextmsg').innerHTML='<div class="feedback bad">Pour continuer : réaliser le travail, cocher la confirmation, trouver toutes les bonnes réponses et rédiger au moins 50 caractères si demandé.</div>';return}s.step++;save();render();window.scrollTo(0,0)}}
function download(){const blob=new Blob(['\ufeff'+lines()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='bilan_informatique_6e.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);s.downloaded=true;save()}
function bilan(){$('app').innerHTML=`<p class="pill">Étape 6 sur 7 · Bilan</p><h2>Mon bilan des missions</h2><p class="score">Note au premier essai : ${score()} / ${total}</p><p>Questions finalement réussies : ${verified()} / ${total}</p><p>Les réponses corrigées après une erreur ne rapportent pas de point supplémentaire.</p><div class="result"><strong>Ce que j’ai appris :</strong><p>Créer un dossier, naviguer entre les onglets, protéger mes données, demander de l’aide contre le cyberharcèlement et vérifier les informations.</p></div><p>Le fichier téléchargé contient <strong>toutes les questions avec leur bonne réponse</strong>, mes réflexions personnelles et ma note. Je vais l’utiliser pour créer mon document dans LibreOffice Writer.</p><button id="download">1. Télécharger mon bilan (.txt)</button><div id="downloadmsg" class="muted small">Le fichier sera généralement enregistré dans le dossier « Téléchargements ».</div><div class="divider"></div><button id="next">2. Passer à LibreOffice Writer</button><div id="nextmsg" aria-live="polite"></div>`;$('download').onclick=()=>{download();$('downloadmsg').textContent='Téléchargement demandé. Vérifier le dossier « Téléchargements ».'};$('next').onclick=()=>{if(!s.downloaded){$('nextmsg').innerHTML='<div class="feedback bad">Télécharger d’abord le bilan pour pouvoir créer le document.</div>';return}s.step=6;save();render();window.scrollTo(0,0)}}
function writer(){$('app').innerHTML=`<p class="pill">Étape 7 sur 7 · environ 12 min</p><h2>Créer mon document avec LibreOffice Writer</h2><div class="task"><strong>Objectif</strong><p>Créer un document propre qui rassemble mes réponses correctes, mes réflexions personnelles et ma note. Enregistrer ce document dans <code>Mes documents → Documents → Informatique_6e</code>.</p></div><h3>1. Ouvrir Writer</h3><ol><li>Revenir sur le bureau (réduire les fenêtres si nécessaire).</li><li>Repérer l’<strong>icône bleue LibreOffice Writer</strong> sur le bureau.</li><li>Double-cliquer sur cette icône pour ouvrir un document vide.</li></ol><h3>2. Retrouver et copier mon bilan</h3><ol><li>Ouvrir le gestionnaire de fichiers, puis le dossier <strong>Téléchargements</strong>.</li><li>Double-cliquer sur <code>bilan_informatique_6e.txt</code>. Il s’ouvre normalement dans un éditeur de texte.</li><li>Appuyer sur <strong>Ctrl + A</strong> pour sélectionner tout le texte, puis sur <strong>Ctrl + C</strong> pour le copier.</li><li>Cliquer dans le document vide de Writer, puis appuyer sur <strong>Ctrl + V</strong> pour coller le bilan.</li></ol><h3>3. Mettre en forme le document</h3><ol><li>Compléter son <strong>nom et son prénom</strong> en haut du document.</li><li>Mettre le titre « MISSION NUMÉRIQUE — SIXIÈME » en <strong>gras</strong>, en taille <strong>18</strong> et en <strong>bleu</strong>.</li><li>Mettre les titres des parties en <strong>gras</strong>, en taille <strong>14</strong>, avec une autre couleur.</li><li>Garder le texte des réponses en taille <strong>11 ou 12</strong>, bien lisible.</li><li>Mettre la <strong>note sur ${total}</strong> en évidence et relire les deux réponses personnelles.</li></ol><h3>4. Enregistrer sous au bon endroit</h3><ol><li>Dans Writer, cliquer sur <strong>Fichier → Enregistrer sous…</strong> (ou appuyer sur <strong>Ctrl + Maj + S</strong>).</li><li>Dans la fenêtre d’enregistrement, aller dans <strong>Mes documents</strong>, puis ouvrir <strong>Documents</strong> et <strong>Informatique_6e</strong>.</li><li>Dans « Nom du fichier », écrire <code>Mission_numerique_6e_NOM</code> en remplaçant NOM par son nom de famille.</li><li>Choisir le format <strong>Document texte ODF (.odt)</strong>, puis cliquer sur <strong>Enregistrer</strong>. Confirmer « Utiliser le format ODF » si demandé.</li><li>Appuyer sur <strong>Ctrl + S</strong> après toute modification.</li><li>Vérifier dans le gestionnaire de fichiers que le document <code>.odt</code> se trouve bien dans le dossier <code>Informatique_6e</code>.</li></ol><div class="bonus"><h3>Défi facultatif — si le travail est terminé</h3><p>Dans <strong>le même document Writer</strong>, ajouter une partie intitulée « Mes conseils pour un élève de sixième ». Écrire trois conseils personnels : un pour protéger ses données, un pour réagir au cyberharcèlement et un pour vérifier une information. Pour chaque conseil, donner un exemple concret. Mettre le titre en couleur et enregistrer de nouveau avec Ctrl + S.</p><label class="check"><input type="checkbox" id="bonus" ${s.bonusDone?'checked':''}> J’ai terminé le défi facultatif.</label></div><label class="check"><input type="checkbox" id="done" ${s.writerDone?'checked':''}> J’ai enregistré mon document Writer dans Informatique_6e et vérifié son emplacement.</label><button class="secondary" id="again">Retélécharger mon bilan (.txt)</button><div id="ready"></div><div class="divider"></div><div class="call">Travail terminé : appeler le professeur pour vérification.</div><p>Présenter au professeur <strong>le fichier Writer ouvert</strong> et son emplacement dans <strong>Informatique_6e</strong>. La note figure dans ce fichier.</p><p class="muted small">Les consignes restent visibles sur cet écran. Il n’est pas nécessaire de revenir aux missions précédentes.</p><button class="secondary" id="restart">Recommencer tout le parcours</button>`;$('done').onchange=e=>{s.writerDone=e.target.checked;save();$('ready').innerHTML=e.target.checked?'<div class="feedback ok">Vérification demandée : montrer le fichier et son emplacement au professeur.</div>':''};$('bonus').onchange=e=>{s.bonusDone=e.target.checked;save()};$('again').onclick=()=>download();$('restart').onclick=()=>{if(confirm('Effacer toutes les réponses et recommencer ?')){s=initial();save();render();window.scrollTo(0,0)}}}render();
</script></body></html>
